[package]
name = "fiber-ffi"
version = "0.9.0-rc2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["rocksdb", "watchtower"]
disable-ckb-rpc = [
    "dep:ckb-app-config",
    "dep:ckb-async-runtime",
    "dep:ckb-hash",
    "dep:ckb-jsonrpc-types",
    "dep:ckb-light-client-lib",
    "dep:ckb-network",
    "dep:ckb-stop-handler",
    "dep:ckb-types",
    "dep:jsonrpc-core",
    "dep:jsonrpc-http-server",
    "dep:secp256k1",
    "ckb-light-client-lib/rocksdb",
]
# v0.5.5-rc1 does not forward ckb-rocksdb's portable feature. This feature
# unifies it explicitly for binaries that must run on a different CPU than the
# build host, including the E2E harness and CI artifacts.
ckb-light-client-portable = [
    "disable-ckb-rpc",
    "fnn/portable",
    "dep:ckb-rocksdb",
]
metrics = ["fnn/metrics"]
portable = ["fnn/portable"]
rocksdb = ["fnn/rocksdb"]
sqlite = ["fnn/sqlite"]
watchtower = ["fnn/watchtower"]

[dependencies]
ckb-app-config = { version = "=1.1.0", optional = true }
ckb-async-runtime = { version = "=1.1.0", optional = true }
ckb-chain-spec = "1"
ckb-hash = { version = "=1.1.0", optional = true }
ckb-jsonrpc-types = { version = "=1.1.1", optional = true }
ckb-light-client-lib = { git = "https://github.com/nervosnetwork/ckb-light-client.git", tag = "v0.5.5-rc1", default-features = false, optional = true }
ckb-network = { version = "=1.1.0", optional = true }
ckb-resource = "1"
ckb-rocksdb = { version = "=0.21.1", default-features = false, features = ["portable"], optional = true }
ckb-stop-handler = { version = "=1.1.0", optional = true }
ckb-types = { version = "=1.1.1", optional = true }
fnn = { git = "https://github.com/nervosnetwork/fiber.git", tag = "v0.9.0-rc2" }
hex = "0.4"
clap-serde-derive = "0.2.1"
jsonrpc-core = { version = "18", optional = true }
jsonrpc-http-server = { version = "18", optional = true }
openssl = { version = "0.10", features = ["vendored"] }
secp256k1 = { version = "0.30", features = ["global-context"], optional = true }
ractor = { version = "0.15", features = ["async-trait"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.32"
tentacle = "0.7.5"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
